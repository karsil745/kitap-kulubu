<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliyofili Kitap Kulübü</title>
    <meta
      name="description"
      content="Arkadaşlarla her ay bir kitap: oylama, okuma takvimi, puanlar ve alıntılar."
    />
    <meta name="theme-color" content="#7c2e2a" />

    <!-- Link önizlemesi (WhatsApp, Instagram, X…). og:image mutlak URL olmalı. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bibliyofili Kitap Kulübü" />
    <meta property="og:title" content="Bibliyofili Kitap Kulübü" />
    <meta
      property="og:description"
      content="Arkadaşlarla her ay bir kitap: oylama, okuma takvimi, puanlar ve alıntılar."
    />
    <meta property="og:url" content="https://kitap-kulubu-nu.vercel.app/" />
    <meta
      property="og:image"
      content="https://kitap-kulubu-nu.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Temayı uygulama açılmadan uygula (yanıp sönmeyi önler) -->
    <script>
      try {
        var t = localStorage.getItem("kk_theme");
        if (!t)
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
